name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  attribution:
    name: No AI attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit, so the whole history is checked.
          fetch-depth: 0
      - name: Files and commit messages
        run: python3 scripts/lint_attribution.py

  template:
    name: Template checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest, themes, assets, brackets
        run: python3 scripts/check_template.py

  luau:
    name: Luau compiles
    runs-on: ubuntu-latest
    env:
      LUAU_VERSION: "0.747"
    steps:
      - uses: actions/checkout@v4
      - name: Install Luau
        run: |
          curl -fsSL -o luau.zip "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          mkdir -p "$RUNNER_TEMP/luau"
          unzip -q luau.zip -d "$RUNNER_TEMP/luau"
          rm luau.zip
          chmod +x "$RUNNER_TEMP/luau/"*
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"
      - name: Compile every .luau file
        # (Syntax only: Zeron's `ui` and the rest are the app's, so the files
        # are compiled, not type-checked.)
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            if ! luau-compile --binary "$f" > /dev/null; then
              echo "::error file=$f::does not compile"
              failed=1
            fi
          done < <(find . -name '*.luau' -not -path './.git/*' -print0)
          exit $failed
